apiVersion: v1
kind: Namespace
metadata:
  name: technitium
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: obeone
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.obeone.cloud
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: technitium
  namespace: technitium
spec:
  interval: 30m
  chart:
    spec:
      chart: technitium-dnsserver
      version: '>=1.13.0 <2.0.0'
      sourceRef:
        kind: HelmRepository
        name: obeone
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      tag: "15.6.0"   # keep in lockstep with the other cluster nodes

    controller:
      strategy: Recreate   # RWO PVC

    persistence:
      config:
        type: pvc
        size: 5Gi

    service:
      main:
        annotations:
          metallb.universe.tf/loadBalancerIPs: 10.0.50.53
        ports:
          http:
            port: 5380
          https:          # cluster API — direct, not via Traefik (DANE)
            port: 53443
          dhcp:
            enabled: false
          dot:
            enabled: false
          doh-reverse:
            enabled: false

    ingress:
      main:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: technitium.wilsonfi.dev
            paths:
              - path: /
                pathType: Prefix
                service:
                  port: 5380
        tls:
          - hosts:
              - technitium.wilsonfi.dev
            secretName: technitium-tls
