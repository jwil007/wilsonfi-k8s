apiVersion: v1
kind: Namespace
metadata:
  name: technitium
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: obeone
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.obeone.cloud
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: technitium
  namespace: technitium
spec:
  interval: 30m
  chart:
    spec:
      chart: technitium-dnsserver
      version: '>=1.13.0 <2.0.0'
      sourceRef:
        kind: HelmRepository
        name: obeone
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      # Pin to the same version as your other cluster nodes (LXC, Pi).
      # Mismatched versions can break clustering.
      tag: "15.6.0"
      pullPolicy: IfNotPresent

    controller:
      replicas: 1
      strategy: Recreate   # RWO PVC; avoid two pods fighting over the volume

    env:
      TZ: America/Phoenix
      DNS_SERVER_DOMAIN: technitium-k8s.wilsonfi.dev
      DNS_SERVER_ADMIN_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: technitium-admin
            key: password

    persistence:
      config:
        enabled: true
        type: pvc
        mountPath: /etc/dns
        accessMode: ReadWriteOnce
        size: 5Gi
        # storageClass: longhorn

    service:
      main:
        type: LoadBalancer
        externalTrafficPolicy: Local   # preserves client IPs in query logs
        annotations:
          # Static IP — required for clustering
          metallb.universe.tf/loadBalancerIPs: 10.0.50.53
        ports:
          http:
            enabled: true
            primary: true
            port: 5380
            targetPort: 5380
            protocol: TCP
          # Cluster API + HTTPS console. Exposed directly, NOT through
          # Traefik — clustering uses DANE and needs TLS end-to-end.
          https:
            enabled: true
            port: 53443
            targetPort: 53443
            protocol: TCP
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP
          dns-tcp:
            enabled: true
            port: 53
            protocol: TCP
          dhcp:
            enabled: false
          dot:
            enabled: false
          doh-reverse:
            enabled: false

    # Admin UI over plain HTTP via Traefik (convenience only)
    ingress:
      main:
        enabled: true
        ingressClassName: traefik
        hosts:
          - host: technitium.wilsonfi.dev
            paths:
              - path: /
                pathType: Prefix
                service:
                  port: 5380
        tls: []