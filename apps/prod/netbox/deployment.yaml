apiVersion: v1
kind: Namespace
metadata:
  name: netbox
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: netbox
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.netbox.oss.netboxlabs.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 30m
  timeout: 15m   # first install runs DB migrations before the pod goes ready
  chart:
    spec:
      chart: netbox
      version: '>=8.0.0 <9.0.0'
      sourceRef:
        kind: HelmRepository
        name: netbox
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    allowedHosts:
      - netbox.wilsonfi.dev
    csrf:
      trustedOrigins:
        - https://netbox.wilsonfi.dev
    timeZone: America/Phoenix

    # All credentials come from SOPS-encrypted secrets in secret.yaml
    existingSecret: netbox-config   # secret_key, api_token_peppers
    superuser:
      existingSecret: netbox-superuser   # username, email, password, api_token
    email:
      existingSecretName: netbox-email   # chart requires the key even with SMTP unset
      existingSecretKey: email-password

    # Chart's "medium" preset caps CPU at 750m, which makes migrations crawl
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

    persistence:
      enabled: true
      size: 5Gi   # uploaded media (device images, attachments)

    # Applies to the bundled postgres too. Granian's worker threads each keep a
    # persistent connection that's never reaped, exhausting max_connections (100);
    # 0 = close after each request.
    externalDatabase:
      connMaxAge: 0

    # Bundled Bitnami subcharts. Bitnami only publishes `latest` now, so pin the
    # running digests — a node pulling a newer `latest` could bring a new PG major
    # that can't open the existing data dir. Digests = PG 18.6 / Valkey 9.1.2.
    postgresql:
      enabled: true
      image:
        digest: sha256:ec3840dfcf0caf786877a67d83bc3ebb0c042fd92445c062ec89c51245290942
      auth:
        existingSecret: netbox-postgresql
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password
      primary:
        persistence:
          size: 10Gi
        # Bitnami's default "nano" preset (192Mi limit) gets OOMKilled under
        # nb_inventory's limit=0 queries
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    valkey:
      enabled: true
      image:
        digest: sha256:3ab4091a7e3cb5f12184a3009cad1aefef50f424c0860d580a41675e38392ba5
      auth:
        existingSecret: netbox-valkey
        existingSecretPasswordKey: valkey-password
      architecture: standalone   # no replicas needed for a homelab
