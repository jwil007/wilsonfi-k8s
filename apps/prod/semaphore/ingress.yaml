apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: semaphore-tls
  namespace: semaphore
spec:
  secretName: semaphore-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - semaphore.wilsonfi.dev
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: semaphore
  namespace: semaphore
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`semaphore.wilsonfi.dev`)
      kind: Rule
      services:
        - name: semaphore
          port: 3000
  tls:
    secretName: semaphore-tls-secret
