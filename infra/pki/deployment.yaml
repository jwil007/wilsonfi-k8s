apiVersion: v1
kind: Namespace
metadata:
  name: pki
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: smallstep
  namespace: pki
spec:
  interval: 24h
  url: https://smallstep.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: step-certificates
  namespace: pki
spec:
  interval: 1h
  chart:
    spec:
      chart: step-certificates
      sourceRef:
        kind: HelmRepository
        name: smallstep
  valuesFrom:
    - kind: Secret
      name: step-ca-values
      valuesKey: values.yaml
  values:
    service:
      type: LoadBalancer
      port: 443
      targetPort: 9000
    ca:
      db:
        enabled: true
        persistent: true
        storageClass: longhorn
        size: 2Gi
