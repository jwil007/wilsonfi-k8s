apiVersion: v1
kind: Namespace
metadata:
  name: pki
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: smallstep
  namespace: pki
spec:
  interval: 24h
  url: https://smallstep.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: step-certificates
  namespace: pki
spec:
  interval: 1h
  chart:
    spec:
      version: 1.30.1
      chart: step-certificates
      sourceRef:
        kind: HelmRepository
        name: smallstep
  valuesFrom:
    - kind: Secret
      name: step-ca-values
      valuesKey: values.yaml
  values:
    # Chart default args plus --resolver: step-ca validates DNS-01 against
    # 1.1.1.1 instead of cluster DNS, whose Technitium resolvers cache the
    # NXDOMAIN from cert-manager's pre-check for 30 min (Cloudflare SOA minimum).
    # Overriding args replaces the chart's list, so re-check on chart upgrades.
    args:
      - --password-file
      - /home/step/secrets/passwords/password
      - --resolver
      - 1.1.1.1:53
      - /home/step/config/ca.json
    service:
      type: LoadBalancer
      port: 443
      targetPort: 9000
    ca:
      db:
        enabled: true
        persistent: true
        storageClass: longhorn
        size: 2Gi
