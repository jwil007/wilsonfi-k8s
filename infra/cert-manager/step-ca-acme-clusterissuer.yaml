apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-acme
spec:
  acme:
    server: https://step-certificates.pki.svc.cluster.local/acme/acme/directory
    caBundle: 
    privateKeySecretRef:
      name: step-ca-acme-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: api-token
              name: cloudflare-api-token-secret
